services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-keycloak.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 12
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start, --import-realm]
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run init-keycloak.sh first}
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run init-keycloak.sh first}
      KC_HOSTNAME: https://sso.lab.test:8443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/server.key
      KC_HTTP_ENABLED: 'false'
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    ports:
      - '192.168.56.20:8443:8443'
    volumes:
      - ./tls:/opt/keycloak/conf/tls:ro
      - ./realm.json:/opt/keycloak/data/import/lab-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
